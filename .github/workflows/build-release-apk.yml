name: Build and Certify Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Production Signed Agila Hub APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Static Web Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://jgpigkeekfuawbyilycq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpncGlna2Vla2Z1YXdieWlseWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzk0NjQsImV4cCI6MjEwNzkxNTQ2NH0.o9Oa1pM9_Ax_cgi7ZvpWXMq2TOTddoAKWNgr8rqmJos' }}
        run: npm run build

      - name: Setup Dual-Route Compatibility Aliases
        run: |
          cp out/auth/login/index.html out/auth/login.html
          cp out/auth/register/index.html out/auth/register.html
          cp out/auth/callback/index.html out/auth/callback.html

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Setup Keystore from Secret
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "Keystore successfully decoded to android/app/release.keystore"

      - name: Build Android Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_BASE64 && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PATH" ] && [ -f "app/$KEYSTORE_PATH" ]; then
            echo "Building production-signed release APK..."
            ./gradlew assembleRelease --stacktrace
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          else
            echo "WARNING: Release keystore secrets not provided. Building unsigned release APK for staging inspection..."
            ./gradlew assembleRelease --stacktrace
            APK_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          
          # Preserve exact final deliverable filename as agila-hub.apk
          mkdir -p ../dist-apk
          cp "$APK_SRC" ../dist-apk/agila-hub.apk
          
          echo "Generating SHA-256 Checksum..."
          sha256sum ../dist-apk/agila-hub.apk > ../dist-apk/agila-hub.apk.sha256
          cat ../dist-apk/agila-hub.apk.sha256

      - name: Verify APK Signature & Identity
        run: |
          echo "Inspecting agila-hub.apk details..."
          ls -lh dist-apk/agila-hub.apk
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose dist-apk/agila-hub.apk || true
          fi

      - name: Upload Deliverable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agila-hub-apk
          path: |
            dist-apk/agila-hub.apk
            dist-apk/agila-hub.apk.sha256
          if-no-files-found: error
          retention-days: 30
