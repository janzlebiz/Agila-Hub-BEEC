name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Agila Hub Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Static Web Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://jgpigkeekfuawbyilycq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpncGlna2Vla2Z1YXdieWlseWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzk0NjQsImV4cCI6MjEwNzkxNTQ2NH0.o9Oa1pM9_Ax_cgi7ZvpWXMq2TOTddoAKWNgr8rqmJos' }}
        run: npm run build

      - name: Setup Dual-Route Compatibility Aliases
        run: |
          echo "Generating dual-route compatibility aliases for Android WebView..."
          cp out/auth/login/index.html out/auth/login.html
          cp out/auth/register/index.html out/auth/register.html
          cp out/auth/callback/index.html out/auth/callback.html
          echo "Dual-route files verified: out/auth/login.html, out/auth/register.html, out/auth/callback.html"

      - name: Validate Packaged Static Web Assets
        run: |
          echo "Validating static export output in out/..."
          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html is missing!"
            exit 1
          fi
          if [ ! -d "out/_next/static" ]; then
            echo "ERROR: out/_next/static is missing!"
            exit 1
          fi
          if [ ! -f "out/auth/login/index.html" ] || [ ! -f "out/auth/login.html" ]; then
            echo "ERROR: auth login directory or fallback asset is missing!"
            exit 1
          fi
          if [ ! -f "out/auth/callback/index.html" ] || [ ! -f "out/auth/callback.html" ]; then
            echo "ERROR: auth callback directory or fallback asset is missing!"
            exit 1
          fi
          HTML_SIZE=$(wc -c < "out/index.html")
          echo "Verified out/index.html size: $HTML_SIZE bytes"
          if [ "$HTML_SIZE" -lt 5000 ]; then
            echo "ERROR: out/index.html is unexpectedly small ($HTML_SIZE bytes). Suspected placeholder!"
            exit 1
          fi
          if grep -q "Redirecting to AGILA Hub" out/index.html; then
            echo "ERROR: out/index.html contains placeholder redirect markup!"
            exit 1
          fi
          echo "Asset validation passed: Real AGILA Hub web assets are present."

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android Packaged Assets & Configuration
        run: |
          echo "Verifying Android packaged assets in android/app/src/main/assets/..."
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "ERROR: Packaged index.html is missing from Android assets!"
            exit 1
          fi
          ASSET_SIZE=$(wc -c < "android/app/src/main/assets/public/index.html")
          echo "Verified Android assets/public/index.html size: $ASSET_SIZE bytes"
          if [ "$ASSET_SIZE" -lt 5000 ]; then
            echo "ERROR: Android packaged index.html is unexpectedly small ($ASSET_SIZE bytes)!"
            exit 1
          fi
          if grep -i "server.url" android/app/src/main/assets/capacitor.config.json || grep -i '"url"' android/app/src/main/assets/capacitor.config.json; then
            echo "ERROR: Remote server.url found in packaged capacitor.config.json!"
            exit 1
          fi
          echo "Android configuration verified: no remote URL redirect configured."

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agila-hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
